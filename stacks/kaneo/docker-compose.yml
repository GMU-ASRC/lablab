services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    container_name: kaneo
    restart: unless-stopped
    environment:
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:-https://tasks.autonomousrobotics.club}
      - DATABASE_URL=postgresql://kaneo:${KANEO_DB_PASSWORD}@core-postgres:5432/kaneo
      - AUTH_SECRET=${AUTH_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://bucket.autonomousrobotics.club}
      - S3_BUCKET=${S3_BUCKET:-kaneo-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=true
      - CUSTOM_OAUTH_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - CUSTOM_OAUTH_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - CUSTOM_OAUTH_DISCOVERY_URL=${AUTHENTIK_DISCOVERY_URL:-https://auth.autonomousrobotics.club/application/o/kaneo/.well-known/openid-configuration}
      - CUSTOM_OAUTH_SCOPES=openid,profile,email
      - CUSTOM_AUTH_PKCE=true
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_PRIVATE_KEY_BASE64=${GITHUB_PRIVATE_KEY_BASE64:-}
      - GITHUB_APP_NAME=${GITHUB_APP_NAME:-}
    ports:
      - 5173:5173
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - core-data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kaneo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - kaneo
    networks:
      - core-data

networks:
  core-data:
    external: true
