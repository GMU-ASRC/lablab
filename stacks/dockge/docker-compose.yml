services:
  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /home/arc/lablab:/home/arc/lablab
    environment:
      - DOCKGE_STACKS_DIR=/home/arc/lablab/stacks
