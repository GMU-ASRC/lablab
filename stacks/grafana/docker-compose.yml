services:
  grafana-init:
    image: alpine
    user: root
    volumes:
      - ./data:/fix/data
    command: sh -c "mkdir -p /fix/data && chown -R 472:472 /fix/data"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    ports:
      - 3300:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.robotics.lab
    volumes:
      - ./data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-net

networks:
  monitoring-net:
    external: true
