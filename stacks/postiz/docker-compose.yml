services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    environment:
      # === Core settings
      MAIN_URL: ${POSTIZ_URL:-https://social.autonomousrobotics.club}
      FRONTEND_URL: ${POSTIZ_URL:-https://social.autonomousrobotics.club}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL:-https://social.autonomousrobotics.club}/api
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD}@core-postgres:5432/postiz
      REDIS_URL: redis://core-valkey:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      RUN_CRON: 'true'

      # === Storage (local disk, bind-mounted below)
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads

      # === Social platform integrations (optional, blank disables that provider)
      # LinkedIn
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # Instagram (Business, via Facebook Login - same app as Facebook Page)
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # YouTube
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}

      # === Authentik SSO (optional; set POSTIZ_GENERIC_OAUTH=true to enable)
      NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: Authentik
      NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authentik.png
      POSTIZ_GENERIC_OAUTH: ${POSTIZ_GENERIC_OAUTH:-false}
      POSTIZ_OAUTH_URL: https://auth.autonomousrobotics.club
      POSTIZ_OAUTH_AUTH_URL: https://auth.autonomousrobotics.club/application/o/authorize
      POSTIZ_OAUTH_TOKEN_URL: https://auth.autonomousrobotics.club/application/o/token
      POSTIZ_OAUTH_USERINFO_URL: https://auth.autonomousrobotics.club/application/o/userinfo
      POSTIZ_OAUTH_CLIENT_ID: ${POSTIZ_AUTHENTIK_CLIENT_ID:-}
      POSTIZ_OAUTH_CLIENT_SECRET: ${POSTIZ_AUTHENTIK_CLIENT_SECRET:-}

      API_LIMIT: 30
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - 4007:5000
    networks:
      - core-data
      - temporal-network
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      temporal:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: postiz-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - postiz
    networks:
      - core-data

  # -----------------------
  # Temporal Stack (workflow engine Postiz's scheduler runs on)
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./data/temporal-postgres:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    restart: unless-stopped
    ports:
      - 127.0.0.1:7233:7233
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      # Remapped from upstream's 8080 - the glance stack already owns host :8080
      - 127.0.0.1:8088:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postiz-config:
  postiz-uploads:
  temporal-elasticsearch-data:

networks:
  core-data:
    external: true
  temporal-network:
    driver: bridge
