head-widgets:
  - type: server-stats
    servers:
      - type: local
        name: MochaNet (ubuwu24)
        hide-swap: true
        hide-mountpoints-by-default: true
        mountpoints:
          "/":
            name: "OS Disk"
            hide: false

columns:
  - size: full
    widgets:
      - type: docker-containers
        hide-by-default: false
        format-container-names: true

  - size: small
    widgets:
      - type: releases
        title: Self-Hosted Updates
        cache: 6h
        repositories:
          - glanceapp/glance
          - go-gitea/gitea
          - go-gitea/act_runner
          - immich-app/immich
          - louislam/dockge
          - NginxProxyManager/nginx-proxy-manager
          - grafana/grafana
          - prometheus/prometheus
