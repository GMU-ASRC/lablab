services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80' # Public HTTP
      - '443:443' # Public HTTPS
      - '81:81' # Admin Web UI
    volumes:
      - /home/arc/stacks/npm/data:/data
      - /home/arc/stacks/npm/letsencrypt:/etc/letsencrypt
